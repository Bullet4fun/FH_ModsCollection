// Forza Horizon 3 Extra Options
// Version v0.6.0
// by Arthur (RokkuDayo): https://github.com/RokkuDayo/ForzaHorizon2_ExtraOptions
// FH3 support by qiangqiang101
// Fork by Bullet4fun for the Azimuth Mod Loader: https://github.com/Bullet4fun/FH_ModsCollection
// The config file for Forza Horizon 3 (Title ID 4CE1DFAB), independent of the other games' config files.
// Read at game startup. A key left out keeps its default.

[Global]
Enabled = 1

[Settings]
InGameMenu = 1                     // Add the Extra Options rows to Settings: HUD and Gameplay (FOV, minimap, drift camera) and Video (liveries). (0 = Off, 1 = On (Default))

[Frontend]
SkipIntro = 1                      // Skip the T10/Microsoft Studios startup video (legal screen stays). (0 = Off, 1 = On (Default))
JumpToManufacturer = 1             // In My Cars, the Autoshow and other car lists, View (or Backspace) opens a grid of manufacturers; pick one to jump to its tab. (0 = Off, 1 = On (Default))
OnlineTabs = 1                     // Keep the Social, Clubs, Rivals and Marketplace pause menu tabs enabled offline. (0 = Off, 1 = On (Default))
ReturnToGarage = 1                 // The pause menu's X button (Help) becomes Return to Garage: enter the nearest festival site's hub (garage, upgrades, paint) from anywhere. (0 = Off, 1 = On (Default))

[Content]
OfflineVIP = 1                     // VIP license refresh and Main/IsVip reads report VIP. (0 = Off, 1 = On (Default))
UnlockTreasureMap = 0              // Unlock the Treasure Map (barn finds and boards on the map) in each world you visit. (0 = Off (Default), 1 = On)
UnlockAllCars = 1                  // Every car hidden from the Autoshow can be bought there, including Forzathon prizes, except Horizon Editions. (0 = Off, 1 = On (Default))
UnlockForzathonHorizonEditionCarsInAutoshow = 0 // Horizon Edition (Forzathon) cars can also be bought in the Autoshow (0: only won in Wheelspins). (0 = Off (Default), 1 = On)
UnlockForzathonHorns = 1           // Forzathon horns (Duck, Cuckoo, Train...) are unlocked in Car Horns. (0 = Off, 1 = On (Default))
HorizonEditionWheelspins = 1       // Wheelspins' Horizon Edition prizes can award any of the 33 Horizon Edition cars (the game: 17 of them). (0 = Off, 1 = On (Default))
UnlockHornAccelerator = 1          // Horn Accelerator add-on (DLC) owned and shown as purchased in Extras. (0 = Off, 1 = On (Default))

[Vehicle]
Autodrive = 1                      // AI drives the car along the GPS route. Throttle, brake or steering cancels. (0 = Off, 1 = On (Default))
AutodriveKey = F2                  // Keyboard toggle: F1-F12, a letter or digit, or a virtual-key code such as 0x71.
AutodriveButtons = L3+R3           // Controller toggle, buttons joined by +: A B X Y LB RB L3 R3 View Menu Up Down Left Right.
AutodriveInAnna = 1                // List "Autodrive" in the ANNA menu's Car submenu (D-pad Down, Car). (0 = Off, 1 = On (Default))
CarPartsInAnna = 1                 // ANNA "Car" submenu: Lights (headlights, hazard lights, left/right indicators) and Doors (open and close the roof, hood, trunk and doors the car animates, or all at once). Parts open only while stationary; the throttle closes them. (0 = Off, 1 = On (Default))
IndicatorsOnDpad = 1               // Hold D-pad Left/Right for 1 s to turn that indicator on or off (a tap still changes the radio station). Indicators turn off once a turn is made and the steering is centred. (0 = Off, 1 = On (Default))
AutodriveCinematic = 1             // Switch to slow orbiting cinematic shots (HUD hidden) after 3 s of Autodrive; camera and HUD return when you take over. (0 = Off, 1 = On (Default))

[HUD]
MinimapFollowsCamera = 1           // Turn the minimap (and its N marker) with the right-stick look camera. (0 = Off, 1 = On (Default))
// FPS readout in the top-right corner of the HUD and of menus with the player bar,
// e.g. "72 GPU:71%  13.9 ms". GPU usage is the total 3D-engine load. Also in Settings > HUD and Gameplay.
ShowFPS = 0
ShowGPUUsage = 1
ShowFrameTime = 1
ShowFPSBackground = 1              // Draw the readout on a dark box (0 shows the text alone). With GPU usage and frame time off it reads "60 FPS". (0 = Off, 1 = On (Default))

[Camera]
// Field of view in degrees (10-150); 0 keeps the game value.
ChaseNearFOV = 0
ChaseFarFOV = 0
HoodFOV = 0
BumperFOV = 0
CockpitFOV = 0
DriftCamera = 0                    // Chase cameras swing toward the direction of travel while the car slides. Also in Settings > HUD and Gameplay. (0 = Off (Default), 1 = On)
// Drift camera tuning in percent: how far it follows the slide, how fast, and the maximum swing.
DriftSensitivity = 35
DriftSpeed = 70
DriftRange = 80

[Livery]
Resolution4K = 1                   // Render car liveries at 4096x4096 (game: 1024 or 2048 by quality). (0 = Off, 1 = On (Default))
MSAA = 4                           // Livery anti-aliasing samples: 2 (game) or 4.
Supersampling = 0                  // Render the livery at twice the resolution again before downsampling (heavier). (0 = Off (Default), 1 = On)

[PhotoMode]
Unrestricted = 1                   // Remove the photo camera boundary and height limits. (0 = Off, 1 = On (Default))
NoCollision = 0                    // Also let the camera pass through the ground, walls and car (altitude keeps working). (0 = Off (Default), 1 = On)

[Files]
EnableMediaOverrides = 1           // Loose files in Mount\mediaoverride and Mount\mediapc override game media. (0 = Off, 1 = On (Default))

[Mods]
Enabled = 1                        // Load mods from mods\Forza Horizon 3\<ModName>\ next to azimuth.exe. Disable a package with <ModName>=0. (0 = Off, 1 = On (Default))

[Compatibility]
DisableParentalLocks = 1           // Ignore Xbox Live parental/privacy restrictions on multiplayer and user-created content (as in FH2). (0 = Off, 1 = On (Default))
GenerateMissingSaveCommits = 1     // Generate missing commit manifests using the actual save contents. (0 = Off, 1 = On (Default))
