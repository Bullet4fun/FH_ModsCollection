// Forza Motorsport 5 Extra Options
// Version v0.6.0
// by Arthur (RokkuDayo): https://github.com/RokkuDayo/ForzaHorizon2_ExtraOptions
// Fork by Bullet4fun for the Azimuth Mod Loader: https://github.com/Bullet4fun/FH_ModsCollection
// The config file for Forza Motorsport 5 (Title ID 7B35D917), independent of the other games' config files.
// A feature switched off here is gone from the game's menus and its saved value is ignored.
// Read at game startup. A key left out keeps its default.

[Global]
Enabled = 1

[Frontend]
HideLevelFasterNotification = 1    // Hide the blue "Press Y to level faster" banner before/after races and in Free Play. 0 restores the original banner. The Y Accelerator action is unchanged. (0 = Off, 1 = On (Default))
HideDrivatarDesignsButton = 1      // Hide the Enable/Disable Drivatar Designs shortcut in the race pause menu. (0 = Off, 1 = On (Default))
SkipIntro = 1                      // Skip intro movies and the early legal disclaimer; keep the Press Start screen. (0 = Off, 1 = On (Default))
E3StartScreen = 0                  // Use the native E3 start-screen layout and animations with normal retail sign-in. Does not enable the restricted E3 demo mode. (0 = Off (Default), 1 = On)
EnableMarketplace = 1              // Keep the main-menu Marketplace tile and entry action available offline. (0 = Off, 1 = On (Default))
AllRimsCategory = 1                // Add all aftermarket rims and all factory rims to the rim-style categories. Retains the original categories; factory wheels load their donor car assets. (0 = Off, 1 = On (Default))
CurrentCarDesignsFirst = 1         // Put the designs that fit the current car at the top of My Designs. (0 = Off, 1 = On (Default))
JumpToManufacturer = 1             // View opens the manufacturer grid in all car selection menus. Wheel Styles uses Y, preserving View for the setup manager. (0 = Off, 1 = On (Default))

[Content]
OfflineVIP = 1                     // Enable the native profile's VIP status. (0 = Off, 1 = On (Default))
GamerpicBadge = 1                  // A badge emblem made from your Azimuth profile picture. (0 = Off, 1 = On (Default))

[Files]
EnableMediaOverrides = 1           // Loose files under Mount\mediaoverride and Mount\mediapc override matching paths under Mount\media. Priority: mediaoverride > mediapc > original media. Example: Mount\mediaoverride\cars\... replaces Mount\media\cars\... (0 = Off, 1 = On (Default))

[Compatibility]
DisableParentalLocks = 1           // Allow multiplayer and user-created content privilege checks locally. (0 = Off, 1 = On (Default))
GenerateMissingSaveCommits = 1     // Generate missing Azimuth v2 save commit markers before FM5 loads its saves. Uses each blob's actual size and SHA-256. Existing commits and save data stay intact. Only scans data\titles\7B35D917\saves beside azimuth.exe. Restart required. (0 = Off, 1 = On (Default))

[Camera]
DriftCamera = 1                    // The drift camera; it starts Off, turn it on in the game's HUD menu. (0 = Off, 1 = On (Default))
FieldOfView = 1                    // Field of view sliders for every camera, in the game's HUD menu. (0 = Off, 1 = On (Default))
Headlights = 1                     // Enable the driving headlight hotkeys configured under [Bindings]. (0 = Off, 1 = On (Default))
// Camera, Video and Player Character settings share FM5_ExtraOptions.dat.
// Video-menu livery choices default to Default and apply on restart.
// Player Character defaults to Default and applies when the model next loads.
// BRIGHTNESS opens the native calibration screen.

[PhotoMode]
FreeCamera = 1                     // Remove the photo camera's collision and boundaries. (0 = Off, 1 = On (Default))
CarControls = 1                    // Reset the car's damage, hide the driver and switch the car's lights in photo mode. (0 = Off, 1 = On (Default))

[Video]
VideoOptions = 1                   // The mod's Video menu: cockpit motion blur, 4K liveries, 4x MSAA and brightness. (0 = Off, 1 = On (Default))

[Audio]
ChannelVolumes = 1                 // Volume sliders for the individual audio channels, in the game's Audio menu. (0 = Off, 1 = On (Default))

[HUD]
PlayerCharacter = 1                // Player model selector at the bottom of the game's HUD menu. (0 = Off, 1 = On (Default))

[Mods]
Enabled = 1                        // FM5 packages go under mods/Forza Motorsport 5 beside azimuth.exe; later loadorder.txt entries win. (0 = Off, 1 = On (Default))
DatabaseCache = 1                  // Reuse the merged database when the base, enabled mods, order and files match. Stored under mods\Cache\fm5-db. Rebuilt automatically after changes. 0 disables persistent caching. (0 = Off, 1 = On (Default))

[Bindings]
// Toggle the player's headlights while driving. Use None to unbind.
HeadlightsXbox = RightStick
HeadlightsKeyboard = F3
ToggleUIKeyboard = F1              // Hide/show UI during driving. Opening a menu restores it automatically. Keyboard accepts F1-F24, letters, named keys (Space, Tab, etc.), or a virtual-key number.
ToggleUIXbox = None                // Controller accepts None, a button name (View, RightStick, LB, etc.), or a button mask. Unbound by default. Choose a button that does not conflict with the game's controls.

[Experiments]
LocalDrivatarLiveries = 0          // Use matching designs from My Designs for FM5 Drivatars. Requires Drivatar Designs to be On in HUD settings. (0 = Off (Default), 1 = On)
MaxDrivatarLiveries = 6            // Maximum opponents assigned local designs per lineup (0-16).
